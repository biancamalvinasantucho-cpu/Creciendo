<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de la Maestra · Sala Los Pollitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-color: #f7f3ed;
    --card-bg: #ffffff;
    --text-main: #2b2d42;
    --primary: #3b82f6;
    --accent-peach: #f4a261;
    --border-color: #e5e7eb;

    /* tokens derivados para completar el sistema */
    --text-muted: #8b8d98;
    --sleep-color: #8b7fd6;
    --success-soft: #eef6ff;
    --shadow-soft: 0 6px 18px rgba(43, 45, 66, 0.07);
    --shadow-hover: 0 10px 24px rgba(43, 45, 66, 0.11);
    --radius-card: 15px;
    --radius-pill: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .brand {
    font-family: 'Nunito', sans-serif;
  }

  /* ---------- HEADER ---------- */
  header.top-bar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-color);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .brand h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
  }

  .brand p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .day-info {
    text-align: right;
  }

  .day-info .date {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: capitalize;
  }

  .presence-count {
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--success-soft);
    color: var(--primary);
    font-weight: 600;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
  }

  /* ---------- MAIN GRID ---------- */
  main {
    padding: 28px 32px 60px;
    max-width: 1280px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    margin: 0 0 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title i { color: var(--accent-peach); }

  .students-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  /* ---------- STUDENT CARD ---------- */
  .student-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-card);
    padding: 20px 18px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }

  .student-card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--bg-color);
    box-shadow: 0 0 0 1px var(--border-color);
    display: block;
  }

  .note-flag {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-peach);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--card-bg);
  }

  .note-flag.visible { display: flex; }

  .student-name {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
  }

  .quick-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    margin-bottom: 10px;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 9px 4px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .action-btn i { font-size: 15px; }

  .action-btn:hover { border-color: var(--text-muted); }

  .action-btn:active { transform: scale(0.94); }

  .action-btn.active[data-action="comio"] {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .action-btn.active[data-action="durmio"] {
    background: var(--sleep-color);
    border-color: var(--sleep-color);
    color: #fff;
  }

  .action-btn.active[data-action="panal"] {
    background: var(--accent-peach);
    border-color: var(--accent-peach);
    color: #fff;
  }

  .observation-btn {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 6px;
    border-top: 1px dashed var(--border-color);
    margin-top: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: color 0.15s ease;
  }

  .observation-btn:hover { color: var(--primary); }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(43, 45, 66, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    padding: 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-hover);
  }

  .modal-box h2 {
    margin: 0 0 4px;
    font-size: 17px;
  }

  .modal-box .modal-sub {
    margin: 0 0 16px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .modal-box textarea {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text-main);
    background: var(--bg-color);
  }

  .modal-box textarea:focus,
  .action-btn:focus-visible,
  .observation-btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  .modal-actions button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--border-color);
  }

  .btn-cancel { background: transparent; color: var(--text-muted); }
  .btn-save { background: var(--primary); color: #fff; border-color: var(--primary); }

  @media (max-width: 640px) {
    header.top-bar { padding: 16px 18px; }
    main { padding: 20px 18px 40px; }
    .day-info { text-align: left; }
  }
</style>
</head>
<body>

<header class="top-bar">
  <div class="brand-block">
    <div class="brand-icon"><i class="fa-solid fa-child-reaching"></i></div>
    <div class="brand">
      <h1>Panel de la Maestra</h1>
      <p>Sala Los Pollitos</p>
    </div>
  </div>
  <div class="day-info">
    <div class="date" id="today-date">martes, 23 de septiembre</div>
    <span class="presence-count"><i class="fa-solid fa-user-check"></i> 8 presentes</span>
  </div>
</header>

<main>
  <h2 class="section-title"><i class="fa-solid fa-users"></i> Alumnos presentes hoy</h2>

  <div class="students-grid" id="students-grid">
    <!-- Las tarjetas se repiten con la misma estructura para cada alumno -->
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-student-name">Observación</h2>
    <p class="modal-sub">Escribí una nota cualitativa sobre el día del niño o la niña.</p>
    <textarea id="modal-textarea" placeholder="Ej: Estuvo muy participativa en la actividad de pintura..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancelar</button>
      <button class="btn-save" id="modal-save">Guardar nota</button>
    </div>
  </div>
</div>

<script>
  const students = [
    { name: "Sofía Martínez", color: "3b82f6" },
    { name: "Mateo Gómez", color: "f4a261" },
    { name: "Valentina López", color: "8b7fd6" },
    { name: "Benjamín Fernández", color: "3b82f6" },
    { name: "Isabella Rodríguez", color: "f4a261" },
    { name: "Thiago Pérez", color: "8b7fd6" },
    { name: "Emma García", color: "3b82f6" },
    { name: "Santiago Díaz", color: "f4a261" },
  ];

  const grid = document.getElementById('students-grid');

  students.forEach((student, index) => {
    const initialsUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(student.name)}&background=${student.color}&color=fff&rounded=true&size=128&bold=true&font-size=0.4`;

    const card = document.createElement('article');
    card.className = 'student-card';
    card.dataset.studentId = index;
    card.innerHTML = `
      <div class="avatar-wrap">
        <img class="avatar" src="${initialsUrl}" alt="Foto de ${student.name}">
        <span class="note-flag" data-flag="${index}"><i class="fa-solid fa-pen"></i></span>
      </div>
      <h3 class="student-name">${student.name}</h3>
      <div class="quick-actions">
        <button class="action-btn" data-action="comio" title="Comió" aria-pressed="false">
          <i class="fa-solid fa-utensils"></i>
          <span>Comió</span>
        </button>
        <button class="action-btn" data-action="durmio" title="Durmió" aria-pressed="false">
          <i class="fa-solid fa-moon"></i>
          <span>Durmió</span>
        </button>
        <button class="action-btn" data-action="panal" title="Cambio de pañal" aria-pressed="false">
          <i class="fa-solid fa-baby"></i>
          <span>Pañal</span>
        </button>
      </div>
      <button class="observation-btn" data-open-modal="${index}" data-student-name="${student.name}">
        <i class="fa-regular fa-pen-to-square"></i> Anotar observación
      </button>
    `;
    grid.appendChild(card);
  });

  // Toggle de botones rápidos
  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.action-btn');
    if (!btn) return;
    const isActive = btn.classList.toggle('active');
    btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
  });

  // Modal de observación
  const overlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-student-name');
  const textarea = document.getElementById('modal-textarea');
  let currentStudentId = null;
  const notes = {};

  grid.addEventListener('click', (e) => {
    const openBtn = e.target.closest('[data-open-modal]');
    if (!openBtn) return;
    currentStudentId = openBtn.dataset.openModal;
    modalTitle.textContent = openBtn.dataset.studentName;
    textarea.value = notes[currentStudentId] || '';
    overlay.classList.add('open');
    textarea.focus();
  });

  function closeModal() {
    overlay.classList.remove('open');
    currentStudentId = null;
  }

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  document.getElementById('modal-save').addEventListener('click', () => {
    if (currentStudentId === null) return;
    notes[currentStudentId] = textarea.value.trim();
    const flag = document.querySelector(`[data-flag="${currentStudentId}"]`);
    if (flag) flag.classList.toggle('visible', notes[currentStudentId].length > 0);
    closeModal();
  });

  // Fecha de hoy en español
  const dateEl = document.getElementById('today-date');
  const today = new Date();
  dateEl.textContent = today.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
</script>

</body>
</html>
