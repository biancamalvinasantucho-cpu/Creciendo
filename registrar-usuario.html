<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/registrar-usuario.css">
    <title>Creciendo - Crear Cuenta</title>
</head>
<body>
    <header>
        <h1>Creciendo</h1>
        <h2>Registro de Nuevo Usuario</h2>
    </header>

    <section class="contenedor-registro">
        <form action="registrar-usuario.php" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>
            
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" placeholder="••••••••" required>
            </div>
            
            <button type="submit">Crear Cuenta</button>
            <a href="index.html">¿Ya tenés cuenta? Iniciar Sesión</a>
        </form>
    </section>
</body>
</html>
